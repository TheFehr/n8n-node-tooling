# Reusable publish workflow, triggered by the caller on a version tag.
#
# npm Trusted Publishing validates the calling workflow's file, so the caller must be
# .github/workflows/publish.yml in the node's repository (see templates/workflows) and the
# package's trusted publisher must name that file. Alternatively pass NPM_TOKEN.
#
# "npm run release" is the publish step @n8n/node-cli documents for CI: inside GitHub
# Actions it runs lint, build and "npm publish" with provenance, and sets the variable the
# package's prepublishOnly guard requires.
name: Publish

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance and Trusted Publishing
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # release notes start at the previous tag
          persist-credentials: false

      # A reusable workflow cannot see the commit it was called at, but the run lists the
      # reusable workflows it called and the commit each was pinned at. This keeps the
      # caller's pin the only place that names a tooling version. Public repositories only:
      # the run is read without any permission beyond contents: read.
      - name: Find the tooling commit this workflow was called at
        id: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          CALLED: TheFehr/n8n-node-tooling/.github/workflows/publish.yml@
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq "[.referenced_workflows[] | select(.path | startswith(\"$CALLED\")) | .sha] | first // empty")
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not find the commit that $CALLED was called at (got '$sha'). The lookup reads the run anonymously, which only works for a public repository."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TheFehr/n8n-node-tooling
          ref: ${{ steps.tooling.outputs.sha }}
          path: .n8n-node-tooling
          persist-credentials: false

      # Outside the workspace, so the package's own test runner, linters and formatters
      # never see the tooling's files.
      - name: Move the tooling out of the workspace
        run: |
          mv .n8n-node-tooling "$RUNNER_TEMP/n8n-node-tooling"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}

      # Trusted Publishing needs a recent npm.
      - name: Update npm
        run: npm install -g npm@11

      # What gets published must be the commit the tag names, on the default branch, under
      # the version the tag says. Trusted Publishing only checks the workflow file, so
      # without this a tag on any branch (or a dispatch from one) would publish.
      - name: Check the tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Publishing runs on a version tag, not on $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $VERSION"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "::error::The tagged commit is not on $DEFAULT_BRANCH"
            exit 1
          fi

      # A rerun after a partial failure (published, but the GitHub release step failed)
      # must not fail on "version already exists".
      - name: Check whether this version is already on npm
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # npm view ignores publishConfig.registry, which npm publish honours: ask the
          # registry the package is published to.
          REGISTRY=$(node -p "require('./package.json').publishConfig?.registry ?? ''")
          if npm view "$NAME@$VERSION" version ${REGISTRY:+--registry "$REGISTRY"} > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      # Never publish a version that does not mirror the recorded upstream version.
      - name: Verify versioning
        run: node "${{ runner.temp }}/n8n-node-tooling/bin/n8n-node-tooling.mjs" verify

      - name: Release
        if: steps.published.outputs.published != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release

      # GitHub generates the notes. The start tag is passed explicitly because GitHub would
      # otherwise diff against the last published *release*, which can be far behind the last
      # tag. Skipped if the release already exists (a rerun).
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          args=(--verify-tag --title "Release $GITHUB_REF_NAME" --generate-notes)
          # The first release has no earlier tag to diff against.
          if PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null); then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          # Hand-written notes (for example a versioning change) go in front of the generated ones.
          NOTES_FILE=".github/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$NOTES_FILE" ] && args+=(--notes-file "$NOTES_FILE")
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
