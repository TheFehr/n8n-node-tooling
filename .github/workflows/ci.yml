# Reusable CI for an n8n community node package.
#
# Caller (see templates/workflows/ci.yml). The job is named "build", so a caller job
# called "ci" shows up as the status check "ci / build".
name: CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      lint-script:
        description: npm script that lints the package.
        type: string
        default: lint
      extra-lint-script:
        description: Optional extra lint script, run as its own step so a failure names the linter. oxlint and the formatter check run on their own when the package has `lint:oxlint` and `format:check` scripts.
        type: string
        default: ""
      build-script:
        description: npm script that builds the package (skipped if the package has none). Built here so a bundling failure shows up before a release is cut, not in the publish job.
        type: string
        default: build
      integration:
        description: Also run the integration pipeline (npm run test:pipeline).
        type: boolean
        default: false
      upstream-patterns:
        description: Extended regular expressions, one per line, for crashes of the service the pipeline tests against. A failed pipeline whose log matches one is reported as an upstream problem instead of unclassified.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A reusable workflow cannot see the commit it was called at, but the run lists the
      # reusable workflows it called and the commit each was pinned at. This keeps the
      # caller's pin the only place that names a tooling version. Public repositories only:
      # the run is read without any permission beyond contents: read.
      - name: Find the tooling commit this workflow was called at
        id: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          CALLED: TheFehr/n8n-node-tooling/.github/workflows/ci.yml@
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq "[.referenced_workflows[] | select(.path | startswith(\"$CALLED\")) | .sha] | first // empty")
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not find the commit that $CALLED was called at (got '$sha'). The lookup needs no permission beyond contents: read, which only works for a public repository."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TheFehr/n8n-node-tooling
          ref: ${{ steps.tooling.outputs.sha }}
          path: .n8n-node-tooling
          persist-credentials: false

      # Outside the workspace, so the package's own test runner, linters and formatters
      # never see the tooling's files.
      - name: Move the tooling out of the workspace
        run: |
          mv .n8n-node-tooling "$RUNNER_TEMP/n8n-node-tooling"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint (${{ inputs.lint-script }})
        env:
          LINT_SCRIPT: ${{ inputs.lint-script }}
        run: npm run "$LINT_SCRIPT"

      - name: Lint (${{ inputs.extra-lint-script }})
        if: ${{ inputs.extra-lint-script != '' }}
        env:
          LINT_SCRIPT: ${{ inputs.extra-lint-script }}
        run: npm run "$LINT_SCRIPT"

      # The shared linters run when the package defines the script, each as its own step so a
      # failure names the tool. A package without the script shows the step as skipped, which
      # `npm run --if-present` would not: it exits 0 and the step would read as passed.
      - name: Find the optional lint scripts
        id: scripts
        run: |
          # Read from package.json directly: `npm pkg get` answers per workspace when the
          # caller's .npmrc enables workspaces, and this workflow supports one package only.
          for script in lint:oxlint format:check; do
            if SCRIPT="$script" node -e 'process.exit(require("./package.json").scripts?.[process.env.SCRIPT] ? 0 : 1)'; then
              echo "${script//:/_}=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Lint (oxlint)
        if: ${{ steps.scripts.outputs.lint_oxlint == 'true' }}
        run: npm run lint:oxlint

      - name: Check formatting (oxfmt)
        if: ${{ steps.scripts.outputs.format_check == 'true' }}
        run: npm run format:check

      - name: Build (${{ inputs.build-script }})
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: npm run "$BUILD_SCRIPT" --if-present

      # A package whose tests need live services runs them in the integration pipeline.
      - name: Unit tests
        if: ${{ !inputs.integration }}
        run: npm run test:run --if-present

      # Only the README is checked here. The version mirror is checked where a version is
      # committed to a release (the release PR job and the publish workflow): main is out of
      # sync on purpose between a compatibility bump and the release that follows it.
      - name: Verify the README documents versioning
        run: node "${{ runner.temp }}/n8n-node-tooling/bin/n8n-node-tooling.mjs" verify --skip-version

      - name: Integration tests
        id: pipeline
        if: ${{ inputs.integration }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run test:pipeline 2>&1 | tee "$RUNNER_TEMP/pipeline.log"

      # Says whether the pipeline broke in the node's own checks or in the environment.
      - name: Classify the pipeline failure
        if: ${{ failure() && steps.pipeline.conclusion == 'failure' }}
        env:
          N8N_NODE_TOOLING_UPSTREAM_PATTERNS: ${{ inputs.upstream-patterns }}
        run: node "${{ runner.temp }}/n8n-node-tooling/bin/n8n-node-tooling.mjs" classify-failure --file "$RUNNER_TEMP/pipeline.log"
